<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="content-language" content="en-CA" />
    <title>TechRoute – Dashboard</title>
    <link rel="stylesheet" href="assets/styles/style.css" />
    <link rel="stylesheet" href="assets/styles/dashboard.css" />
  </head>
  <body>
    <div class="topbar" role="navigation" aria-label="Primary">
      <div class="topbar-inner">
        <header>
          <h1>Technical Service Management</h1>
        </header>

        <nav class="nav-actions" aria-label="Primary navigation">
          <a href="index.html" class="btn-toggle">New Appointment</a>
        </nav>
      </div>
    </div>

    <main class="container">
      <div class="filter-bar" aria-label="Filters">
        <div class="filter-group">
          <label for="status-filter">Filter by status:</label>
          <select id="status-filter">
            <option value="All">All Status</option>
            <option value="Scheduled">Scheduled</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
            <option value="Canceled">Canceled</option>
            <option value="Rescheduled">Rescheduled</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="technician-filter">Filter by technician:</label>
          <select id="technician-filter">
            <option value="All">All Technicians</option>
            <option value="Olivia Brown">Olivia Brown</option>
            <option value="Liam Johnson">Liam Johnson</option>
            <option value="Emma Wilson">Emma Wilson</option>
            <option value="Noah Thompson">Noah Thompson</option>
          </select>
        </div>
      </div>
      <h2>Visit Dashboard</h2>

      <section id="visit-list-container">
        <p id="loading-message" aria-live="polite">Loading visits...</p>
        <div id="loading-spinner" class="spinner" aria-hidden="true"></div>
        <div id="visit-list"></div>
      </section>
    </main>

    <script src="scripts/services/api.js"></script>
    <script src="scripts/dashboard.js"></script>
  </body>
</html>
